[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "subtoken-attention-cpu-lab"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=1.26,<3"]
[project.scripts]
subtoken-lab = "subtoken_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
